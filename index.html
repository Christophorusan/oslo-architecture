<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0;url=https://oslo-teamview-git-main-chrisportugals-projects.vercel.app/analytics">
  <link rel="canonical" href="https://oslo-teamview-git-main-chrisportugals-projects.vercel.app/analytics">
  <title>Oslo · Analytics</title>
  <script>
    (function () {
      var base = "https://oslo-teamview-git-main-chrisportugals-projects.vercel.app";
      var current = new URL(window.location.href);
      var view = current.searchParams.get("view");
      var routes = { analytics: "/analytics", operator: "/today", calendar: "/calendar", roadmap: "/calendar", content: "/calendar?type=content" };
      var target = new URL(routes[view] || "/analytics", base);
      current.searchParams.delete("view");
      current.searchParams.forEach(function (value, key) { target.searchParams.set(key, value); });
      target.hash = current.hash;
      window.location.replace(target.href);
    })();
  </script>
</head>
<body>
  <main>
    <h1>Oslo</h1>
    <p>Opening the unified Oslo workspace…</p>
    <p><a href="https://oslo-teamview-git-main-chrisportugals-projects.vercel.app/analytics">Continue to Oslo Analytics</a></p>
  </main>
</body>
</html>
